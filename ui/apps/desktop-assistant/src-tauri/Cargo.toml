[package]
name = "desktop-assistant"
version = "0.1.0"
description = "The Poolside desktop assistant shell."
authors = ["Poolside <hello@poolside.ai>"]
publish = false
edition = "2021"

[lib]
name = "desktop_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
spoolside-profiling = []

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

# Smaller release binary (~43MB of it is code + symbols): thin LTO and one
# codegen unit shrink and speed the shipped code; stripping debuginfo drops
# the DWARF sections while keeping the symbol table, so macOS .ips crash
# reports, atos, sample, and spindump still name Rust frames (no dSYM
# pipeline exists to compensate for a full strip). A smaller binary also
# means less first-launch Gatekeeper verification and update download.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dependencies]
base64 = "0.22.1"
# Already in the dependency tree via serde_with; used to timestamp
# per-session helper log file names (see helper.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lsp-types = "0.97"
notify = "8"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# `macos-private-api` is required to build transparent windows on macOS, which
# in turn lets us render the native NSVisualEffectView vibrancy behind the
# webview (see src/navigation.rs). Paired with `macOSPrivateApi: true` in
# tauri.conf.json. Note: this makes the app ineligible for the Mac App Store,
# which is fine — it ships as a notarized DeveloperTool bundle outside the MAS.
tauri = { version = "2", features = ["isolation", "macos-private-api"] }
# Re-verify the staged update archive before installing it (see updater.rs).
# The same crate the updater plugin uses for its own download verification,
# already in the dependency tree.
minisign-verify = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Relaunches the app after an update is installed (see src/updater.ts / relaunch()).
tauri-plugin-process = "2"
tauri-plugin-screenshots = "2.2.0"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
# Already in the dependency tree via Tauri; used for bounding helper round-trips
# (see settings.rs file_opener_from_db) so reads/writes never block the UI, and
# for awaiting native menu results from the main thread (see native_menu.rs).
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
# Polls the assistant-terminal PTY termios so the clear-screen Ctrl+L is only
# injected once the shell's line editor is active (see terminal.rs), and
# validates locale names before exporting them (see terminal_locale.rs).
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# Self-update via the CrabNebula Cloud feed. Desktop-only (there is no mobile
# build). The minisign public key + updater endpoint live in tauri.conf.json
# under plugins.updater; the private signing key is supplied in CI via
# TAURI_SIGNING_PRIVATE_KEY. Registered in lib.rs setup() under #[cfg(desktop)].
# Use native-tls (the OS/system cert store — Secure Transport on macOS) instead
# of the default rustls-tls, so we don't bundle the CDLA-licensed Mozilla CA
# roots (webpki-root-certs). Keep `zip` — it unpacks the macOS .app.tar.gz.
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
  "zip",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Used by src/desktop_notification.rs to send clickable, cancellable native notifications.
mac-notification-sys = "0.6"
# Used by src/dock.rs to set a per-worktree dock icon + dock-hover name at
# runtime when launched under spoolside (see SPOOLSIDE_DOCK_ICON_COLOR / _APP_NAME),
# and by src/desktop_notification.rs for macOS notification activation interop.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  # Reads the user's macOS accent colour under both appearances so the webview
  # can follow it (see src/system_accent.rs).
  "NSAppearance",
  # NSFontAttributeName/NSForegroundColorAttributeName and attributed-string
  # drawing/measurement for the native menu rows' SELECTED pill text
  # (see src/native_menu.rs).
  "NSAttributedString",
  # Draws the row highlight, SELECTED pill, and separator lines of the
  # HTML-dropdown-styled native menu rows (see src/native_menu.rs).
  "NSBezierPath",
  # Draws the shipped app icon into a bitmap so its plate can be recoloured at
  # runtime (see src/app_icon.rs).
  "NSBitmapImageRep",
  # Custom-view menu rows styled like the app's dropdowns: NSTextField labels,
  # icon/chevron NSImageViews, a hover-tracked star NSButton, semibold pill
  # text, wrapped sublabels, and per-view appearance (see src/native_menu.rs).
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSColor",
  "NSColorSpace",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSImageView",
  "NSMenu",
  "NSMenuItem",
  "NSParagraphStyle",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSStringDrawing",
  "NSTextField",
  # Hover tracking for the star button's image lift and hover fill
  # (see src/native_menu.rs).
  "NSTrackingArea",
  "NSView",
  "NSWorkspace",
  "block2",
  "objc2-core-foundation",
  "std",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  # Builds and measures the SELECTED pill's attributed string for the native
  # menu rows (see src/native_menu.rs).
  "NSAttributedString",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  # Observes NSSystemColorsDidChangeNotification for live accent updates
  # (see src/system_accent.rs).
  "NSNotification",
  "NSOperation",
  # Reads the user's macOS locale so spawned terminals get a matching LANG
  # (see src/terminal_locale.rs).
  "NSLocale",
  "NSRange",
  "NSString",
  "NSURL",
  "std",
] }
block2 = "0.6"
