<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Poolside</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      html,
      body {
        background: transparent;
      }

      #desktop-startup-frame {
        position: fixed;
        inset: 0;
        z-index: 1000;
      }

      #desktop-startup-drag-region {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        z-index: 1;
        height: 33px;
      }
    </style>
  </head>
  <body class="desktop-app-starting">
    <div id="app"></div>
    <div id="desktop-startup-frame">
      <div id="desktop-startup-drag-region" data-tauri-drag-region="deep"></div>
      <div id="desktop-startup-logo"></div>
    </div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
