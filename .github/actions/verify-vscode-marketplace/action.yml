name: Verify VS Code Marketplace release
description: Fail closed on version collisions and verify existing VSIX provenance

inputs:
  mode:
    description: artifacts before publication or preflight before tag creation
    required: true
  release-action:
    description: Release planner action (release or resume)
    required: true
  extension-id:
    description: Marketplace publisher.name identity
    required: true
  version:
    description: Numeric extension version
    required: true
  channel:
    description: stable or nightly
    required: true
  provenance-file:
    description: Expected immutable provenance JSON
    required: true

runs:
  using: composite
  steps:
    - name: Verify Marketplace state
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        RELEASE_ACTION: ${{ inputs.release-action }}
        EXTENSION_ID: ${{ inputs.extension-id }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        PROVENANCE_FILE: ${{ inputs.provenance-file }}
      run: |
        set -euo pipefail
        [[ "${MODE}" == "artifacts" || "${MODE}" == "preflight" ]] || {
          echo "mode must be artifacts or preflight" >&2
          exit 1
        }
        [[ "${RELEASE_ACTION}" == "release" || "${RELEASE_ACTION}" == "resume" ]] || {
          echo "release-action must be release or resume" >&2
          exit 1
        }
        [[ "${CHANNEL}" == "stable" || "${CHANNEL}" == "nightly" ]] || {
          echo "channel must be stable or nightly" >&2
          exit 1
        }
        [[ -f "${PROVENANCE_FILE}" ]] || {
          echo "Missing expected provenance file: ${PROVENANCE_FILE}" >&2
          exit 1
        }
        expected_provenance=$(jq -S -c . "${PROVENANCE_FILE}")

        publisher=${EXTENSION_ID%%.*}
        extension=${EXTENSION_ID#*.}
        [[ -n "${publisher}" && -n "${extension}" && "${publisher}.${extension}" == "${EXTENSION_ID}" ]] || {
          echo "extension-id must be a publisher.name identity" >&2
          exit 1
        }

        if [[ "${MODE}" == "artifacts" ]]; then
          shopt -s nullglob
          packages=(release-artifacts/*.vsix)
          [[ "${#packages[@]}" -eq 7 ]] || {
            echo "Expected exactly seven VSIX artifacts, found ${#packages[@]}." >&2
            exit 1
          }
          for target in universal darwin-x64 darwin-arm64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            package="release-artifacts/vscode-${VERSION}-${target}.vsix"
            [[ -f "${package}" ]] || {
              echo "Missing expected ${target} VSIX: ${package}" >&2
              exit 1
            }
            package_json=$(unzip -p "${package}" extension/package.json) || {
              echo "${package} has no extension/package.json." >&2
              exit 1
            }
            jq -e \
              --arg publisher "${publisher}" \
              --arg extension "${extension}" \
              --arg version "${VERSION}" \
              '.publisher == $publisher and .name == $extension and .version == $version' \
              <<<"${package_json}" >/dev/null || {
                echo "${package} does not contain ${EXTENSION_ID} ${VERSION}." >&2
                exit 1
              }
            actual_json=$(unzip -p "${package}" extension/release-provenance.json) || {
              echo "${package} has no immutable release provenance." >&2
              exit 1
            }
            actual_provenance=$(jq -S -c . <<<"${actual_json}")
            [[ "${actual_provenance}" == "${expected_provenance}" ]] || {
              echo "${package} contains the wrong source, app, or tag provenance." >&2
              exit 1
            }
            vsix_manifest=$(unzip -p "${package}" extension.vsixmanifest) || {
              echo "${package} has no extension.vsixmanifest." >&2
              exit 1
            }
            if [[ "${target}" == "universal" ]]; then
              ! grep -Fq 'TargetPlatform=' <<<"${vsix_manifest}" || {
                echo "Universal VSIX unexpectedly declares a target platform." >&2
                exit 1
              }
            else
              grep -Fq "TargetPlatform=\"${target}\"" <<<"${vsix_manifest}" || {
                echo "${package} does not declare target platform ${target}." >&2
                exit 1
              }
            fi
            if [[ "${CHANNEL}" == "nightly" ]]; then
              grep -Fq 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"' \
                <<<"${vsix_manifest}" || {
                  echo "${package} is not marked as a pre-release VSIX." >&2
                  exit 1
                }
            else
              ! grep -Fq 'Id="Microsoft.VisualStudio.Code.PreRelease"' <<<"${vsix_manifest}" || {
                echo "${package} is unexpectedly marked as a pre-release VSIX." >&2
                exit 1
              }
            fi
          done
          exit 0
        fi

        listing=$(pnpm -F ./ui/apps/vscode-assistant exec vsce show "${EXTENSION_ID}" --json)
        if [[ "${listing}" == "undefined" ]]; then
          exit 0
        fi
        jq -e . <<<"${listing}" >/dev/null

        exact_count=$(jq --arg version "${VERSION}" '[.versions[]? | select(.version == $version)] | length' <<<"${listing}")
        highest=$(jq -r '
          [
            .versions[]?.version
            | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
            | split(".")
            | map(tonumber)
          ]
          | max // empty
          | if type == "array" then join(".") else empty end
        ' <<<"${listing}")
        if [[ "${MODE}" == "preflight" && "${RELEASE_ACTION}" == "release" ]]; then
          [[ "${exact_count}" -eq 0 ]] || {
            echo "${EXTENSION_ID} already contains ${VERSION}, but this is not a resumable release." >&2
            exit 1
          }
          if [[ -n "${highest}" ]] && ! jq -en \
            --arg candidate "${VERSION}" \
            --arg highest "${highest}" \
            'def parts: split(".") | map(tonumber); ($candidate | parts) > ($highest | parts)' \
            >/dev/null; then
            echo "Planned VS Code version ${VERSION} must be newer than Marketplace maximum ${highest}." >&2
            echo "Git tag removal does not reset versions in a reused Marketplace application." >&2
            exit 1
          fi
          exit 0
        fi

        if [[ "${MODE}" == "preflight" && "${exact_count}" -lt 7 && -n "${highest}" ]] && \
          ! jq -en \
            --arg candidate "${VERSION}" \
            --arg highest "${highest}" \
            'def parts: split(".") | map(tonumber); ($candidate | parts) >= ($highest | parts)' \
            >/dev/null; then
          echo "Incomplete ${EXTENSION_ID} ${VERSION} cannot resume after newer Marketplace version ${highest}." >&2
          exit 1
        fi

        declare -A seen=()
        while IFS=$'\t' read -r target prerelease; do
          [[ -n "${target}" ]] || continue
          case "${target}" in
            universal|darwin-x64|darwin-arm64|linux-x64|linux-arm64|win32-x64|win32-arm64) ;;
            *)
              echo "Unexpected Marketplace target for ${VERSION}: ${target}" >&2
              exit 1
              ;;
          esac
          [[ -z "${seen[${target}]:-}" ]] || {
            echo "Marketplace contains duplicate ${VERSION}/${target} entries." >&2
            exit 1
          }
          seen[${target}]=true
          if [[ "${CHANNEL}" == "nightly" ]]; then
            [[ "${prerelease}" == "true" ]] || {
              echo "Marketplace ${VERSION}/${target} is not marked pre-release." >&2
              exit 1
            }
          else
            [[ "${prerelease}" == "false" ]] || {
              echo "Marketplace ${VERSION}/${target} is unexpectedly marked pre-release." >&2
              exit 1
            }
          fi

          url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/${publisher}/vsextensions/${extension}/${VERSION}/vspackage"
          [[ "${target}" == "universal" ]] || url="${url}?targetPlatform=${target}"
          package=$(mktemp "${RUNNER_TEMP}/marketplace-${target}.XXXXXX.vsix")
          curl --fail --silent --show-error --location --compressed \
            --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            "${url}" --output "${package}"
          if ! actual_json=$(unzip -p "${package}" extension/release-provenance.json); then
            echo "Marketplace ${VERSION}/${target} has no Poolside release provenance." >&2
            exit 1
          fi
          actual_provenance=$(jq -S -c . <<<"${actual_json}")
          [[ "${actual_provenance}" == "${expected_provenance}" ]] || {
            echo "Marketplace ${VERSION}/${target} belongs to another source or tag lineage." >&2
            exit 1
          }
        done < <(
          jq -r --arg version "${VERSION}" '
            .versions[]?
            | select(.version == $version)
            | [
                (.targetPlatform // "universal"),
                (any(
                  .properties[]?;
                  .key == "Microsoft.VisualStudio.Code.PreRelease" and .value == "true"
                ) | tostring)
              ]
            | @tsv
          ' <<<"${listing}"
        )
