name: "Sign Windows Binary"
description: "Extract, sign with SSL.com, and repackage a Windows binary"

inputs:
  archive_path:
    description: "Path to the tar.gz archive containing the Windows binary"
    required: true
  binary_name:
    description: "Name of the binary without extension (e.g., poolside-helper-windows-amd64)"
    required: true
  username:
    description: "SSL.com account username"
    required: true
  password:
    description: "SSL.com account password"
    required: true
  credential_id:
    description: "SSL.com credential ID"
    required: true
  totp_secret:
    description: "SSL.com TOTP secret"
    required: true
  checksum_name:
    description: "Name for the checksum file (defaults to binary_name.checksum)"
    required: false
    default: ""

outputs:
  signed_archive_path:
    description: "Path to the signed tar.gz archive"
    value: ${{ steps.repackage.outputs.archive_path }}
  signed_checksum_path:
    description: "Path to the checksum file"
    value: ${{ steps.repackage.outputs.checksum_path }}

runs:
  using: "composite"
  steps:
    - name: Extract Windows binary for signing
      shell: bash
      run: |
        mkdir -p signing-workspace
        tar --no-same-owner -xzf ${{ inputs.archive_path }} -C signing-workspace

    - name: Sign Windows binary with SSL.com
__POOL_SYNTHETIC_IMPORT_BASELINE__
      with:
        command: sign
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        credential_id: ${{ inputs.credential_id }}
        totp_secret: ${{ inputs.totp_secret }}
        file_path: signing-workspace/${{ inputs.binary_name }}.exe
        override: true

    - name: Repackage signed Windows binary
      id: repackage
      shell: bash
      run: |
        cd signing-workspace
        CHECKSUM_NAME="${{ inputs.checksum_name }}"
        if [ -z "$CHECKSUM_NAME" ]; then
          CHECKSUM_NAME="${{ inputs.binary_name }}.checksum"
        fi
        tar -czf ${{ inputs.binary_name }}.tar.gz ${{ inputs.binary_name }}.exe
        sha256sum ${{ inputs.binary_name }}.tar.gz > "$CHECKSUM_NAME"
        echo "archive_path=signing-workspace/${{ inputs.binary_name }}.tar.gz" >> $GITHUB_OUTPUT
        echo "checksum_path=signing-workspace/$CHECKSUM_NAME" >> $GITHUB_OUTPUT
