name: License Check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/license-check.yml
      - grant.yaml
      - scripts/license-check.sh
      - scripts/render-license-report.sh
      - THIRD-PARTY-DEPENDENCIES.md
      - docs/license-checks.md
      - go.mod
      - go.sum
      - MODULE.bazel
      - MODULE.bazel.lock
      - package.json
      - pnpm-lock.yaml
      - ui/**/package.json
      - ui/apps/desktop-assistant/src-tauri/Cargo.toml
      - ui/apps/desktop-assistant/src-tauri/Cargo.lock
      - cmd/poolside-mlx-sidecar/Package.resolved
  # Required checks must report on every PR, including documentation-only changes.
  pull_request:

jobs:
  license-check:
    name: Dependency license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install Grant
        run: go install github.com/anchore/grant/cmd/grant@v0.6.7

      - name: Check licenses
        run: scripts/license-check.sh

      - name: Verify generated dependency report
        run: git diff --exit-code -- THIRD-PARTY-DEPENDENCIES.md

      - name: Upload license check output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-check-output
          path: license-check-output/
          retention-days: 7
