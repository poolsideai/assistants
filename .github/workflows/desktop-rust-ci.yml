name: Desktop Rust CI

# Tests the desktop assistant crate through mbx (https://mr-boxington.jdx.dev),
# the cargo runner configured in tauri.conf.json. Only pushes to main save the
# mbx GitHub Actions cache; pull requests — forks included — restore it
# read-only, so a PR cannot poison the cache. Release builds never read it
# (see release-desktop.yml).
on:
  push:
    branches:
      - main
    paths:
      - ui/apps/desktop-assistant/src-tauri/**
      - .github/workflows/desktop-rust-ci.yml
  pull_request:
    paths:
      - ui/apps/desktop-assistant/src-tauri/**
      - .github/workflows/desktop-rust-ci.yml
  # Manual reseed after a toolchain or mbx upgrade invalidates the cache
  # between src-tauri changes (save-on-workflow-dispatch below).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Cargo test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup UI
        uses: ./.github/actions/ui-setup

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # After the Rust toolchain, so the cache key sees the rustc the build
      # will use.
      - name: Setup mbx build cache
        uses: jdx/mr-boxington-action@a20e1ffcd962370fb2b6045c13b7b349f7b03386 # v1.3.1
        with:
          # Pinned so CI and `make setup` agree and an mbx release cannot
          # change CI behaviour on its own; bump both together.
          version: 1.11.1
          save-on-workflow-dispatch: true

      # tauri.conf.json bundles the helper runtime as resources; tauri-build's
      # build script fails without them, even for a dev-profile test build.
      # copy-helper.mjs downloads them with the gh CLI, hence GH_TOKEN.
      - name: Download bundled binaries
        env:
          GH_TOKEN: ${{ github.token }}
          # PRs use their base repository until the migration destination has
          # releases; pushes and manual runs use the public canonical runtime.
          POOLSIDE_HELPER_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || 'poolsideai/assistants' }}
        run: pnpm -F @poolsideai/desktop-assistant download:binaries aarch64-apple-darwin

      # tauri-build embeds the isolation app (dist-isolation) at compile time,
      # even for a dev-profile test build.
      - name: Build isolation assets
        run: pnpm -F @poolsideai/desktop-assistant build:isolation

      - name: Test
        working-directory: ui/apps/desktop-assistant/src-tauri
        run: mbx test
