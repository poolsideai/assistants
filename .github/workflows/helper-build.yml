# Builds poolside-helper cross-platform using Bazel + Zig cross-compilation.
# Can be triggered directly for testing or called from helper and product releases.
#
# To trigger a test build without tagging a release, run:
#
#   gh workflow run poolside-helper-build --ref <YOUR_BRANCH> -f 'tag=0.0.1-build.1'
name: poolside-helper-build
on:
__POOL_SYNTHETIC_IMPORT_BASELINE__
    inputs:
      tag:
        description: "Version tag to embed (e.g. helper/v1.2.3)"
        type: string
        required: false
      version:
        description: "Exact version string to embed instead of deriving one from tag"
        type: string
        required: false
      ref:
        description: "Exact source ref to build"
        type: string
        required: false
      sign:
        description: "Sign and notarize release binaries"
        type: boolean
        required: false
        default: true
__POOL_SYNTHETIC_IMPORT_BASELINE__
    inputs:
__POOL_SYNTHETIC_IMPORT_BASELINE__
        description: "Version tag to embed (e.g. helper/v1.2.3)"
        type: string
__POOL_SYNTHETIC_IMPORT_BASELINE__
      sign:
        description: "Sign and notarize release binaries"
        type: boolean
        required: true
        default: true

jobs:
  build:
    uses: ./.github/workflows/reusable-bazel-build.yml
    with:
      bazel_target: //cmd/poolside-helper:poolside-helper
      binary_name: poolside-helper
      tag: ${{ inputs.tag || github.ref_name }}
      version: ${{ inputs.version }}
      tag_prefix: helper/
      ref: ${{ inputs.ref || github.sha }}
      sign_windows: ${{ inputs.sign }}
      sign_darwin: ${{ inputs.sign }}
      embed_mobile_webui: true
    secrets: inherit

  mlx-sidecar:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Build MLX sidecar
        shell: bash
        run: |
          set -euo pipefail
          cmd/poolside-mlx-sidecar/scripts/build.sh dist >/dev/null
          mv dist/poolside-mlx-sidecar dist/poolside-mlx-sidecar-darwin-arm64
          chmod u+w dist/poolside-mlx-sidecar-darwin-arm64

      - name: Sign macOS sidecar
        if: inputs.sign
        uses: ./.github/actions/sign-darwin-binary
        with:
          BINARY_PATH: dist/poolside-mlx-sidecar-darwin-arm64
          ASC_ISSUER_ID: "e628afce-10f7-40a3-82aa-94b7dea7a697"
          ASC_KEY_ID: "Y96B9U9WSZ"
          MACOS_DEVID_P12_B64: ${{ secrets.MACOS_DEVID_P12_B64 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}

      - name: Package MLX sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf poolside-mlx-sidecar-darwin-arm64.tar.gz poolside-mlx-sidecar-darwin-arm64 default.metallib mlx.metallib
          shasum -a 256 poolside-mlx-sidecar-darwin-arm64.tar.gz > poolside-mlx-sidecar-darwin-arm64.checksum

      - name: Upload MLX sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-poolside-mlx-sidecar-darwin-arm64
          path: |
            dist/poolside-mlx-sidecar-darwin-arm64.tar.gz
            dist/poolside-mlx-sidecar-darwin-arm64.checksum
          retention-days: 7

  whisper-server:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Checkout whisper.cpp
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.2.2
        with:
          repository: ggml-org/whisper.cpp
          ref: f049fff95a089aa9969deb009cdd4892b3e74916 # v1.9.1
          path: whisper.cpp

      # Static libs plus an embedded Metal library make the binary
      # self-contained (system frameworks only); GGML_NATIVE=OFF keeps it
      # portable across Apple Silicon generations.
      - name: Build whisper-server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j 4 --target whisper-server
          mkdir -p dist
          cp whisper.cpp/build/bin/whisper-server dist/poolside-whisper-server-darwin-arm64
          chmod u+w dist/poolside-whisper-server-darwin-arm64

      - name: Sign macOS whisper-server
        if: inputs.sign
        uses: ./.github/actions/sign-darwin-binary
        with:
          BINARY_PATH: dist/poolside-whisper-server-darwin-arm64
          ASC_ISSUER_ID: "e628afce-10f7-40a3-82aa-94b7dea7a697"
          ASC_KEY_ID: "Y96B9U9WSZ"
          MACOS_DEVID_P12_B64: ${{ secrets.MACOS_DEVID_P12_B64 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}

      - name: Package whisper-server
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf poolside-whisper-server-darwin-arm64.tar.gz poolside-whisper-server-darwin-arm64
          shasum -a 256 poolside-whisper-server-darwin-arm64.tar.gz > poolside-whisper-server-darwin-arm64.checksum

      - name: Upload whisper-server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-poolside-whisper-server-darwin-arm64
          path: |
            dist/poolside-whisper-server-darwin-arm64.tar.gz
            dist/poolside-whisper-server-darwin-arm64.checksum
          retention-days: 7
