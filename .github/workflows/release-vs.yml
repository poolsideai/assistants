name: Publish · Visual Studio

# Product-only workflow; callers prepare the shared helper runtime first.
# Nightly releases publish an unsigned VSIX to GitHub Releases. Stable
# releases still follow the manual process in ui/apps/vs-assistant/README.md
# until Marketplace publication is automated.
on:
  workflow_call:
    inputs:
      release:
        description: "Release type"
        required: false
        default: preview
        type: string
      version:
        description: "Exact version selected by the product release coordinator"
        required: false
        type: string
      create_lineage:
        description: "Explicitly bootstrap the managed lineage at the supplied exact version"
        required: false
        default: false
        type: boolean
      helper_version:
        description: "Exact helper version built by the product release coordinator"
        required: false
        type: string
      helper_tag:
        description: "Permanent helper release consumed by product packaging"
        required: false
        type: string
      scheduled:
        description: "Apply scheduled Preview gates and no-change detection"
        required: false
        default: false
        type: boolean
      trigger:
        description: "Original Actions event for release notifications"
        required: false
        type: string
    secrets:
      RELEASE_GIT_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  plan:
    name: Plan
    if: github.repository == 'poolsideai/assistant'
    runs-on: ubuntu-latest
    outputs:
      needs_release: ${{ steps.plan.outputs.needs_release || 'false' }}
      action: ${{ steps.plan.outputs.action }}
      channel: ${{ steps.gate.outputs.channel }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      changelog_tag: ${{ steps.plan.outputs.changelog_tag }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      tag_annotation_base64: ${{ steps.plan.outputs.tag_annotation_base64 }}
    steps:
      - name: Check release gates
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCT_ENABLED: ${{ vars.VS_RELEASES_ENABLED }}
          NIGHTLY_ENABLED: ${{ vars.NIGHTLY_RELEASES_ENABLED }}
          REQUESTED_RELEASE: ${{ inputs.release || 'preview' }}
          REQUESTED_SCHEDULED: ${{ inputs.scheduled || false }}
        run: |
          set -euo pipefail
          release="${REQUESTED_RELEASE}"
          scheduled="${REQUESTED_SCHEDULED}"

          if [[ "${EVENT_NAME}" == "schedule" || "${scheduled}" == "true" ]]; then
            release="preview"
            scheduled=true
          fi

          if [[ "${release}" != "preview" ]]; then
            echo "Visual Studio stable releases are not automated yet; follow the manual release process in ui/apps/vs-assistant/README.md." >&2
            exit 1
          fi

          {
            echo "channel=nightly"
            echo "scheduled=${scheduled}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${PRODUCT_ENABLED}" != "true" ]]; then
            if [[ "${scheduled}" == "true" ]]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "### Visual Studio schedule skipped: VS_RELEASES_ENABLED is not true" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "VS_RELEASES_ENABLED must be exactly true for publication." >&2
            exit 1
          fi
          if [[ "${NIGHTLY_ENABLED}" != "true" ]]; then
            if [[ "${scheduled}" == "true" ]]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "### Visual Studio schedule skipped: NIGHTLY_RELEASES_ENABLED is not true" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "NIGHTLY_RELEASES_ENABLED must be exactly true for Preview publication." >&2
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate publication source
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/main" ]] || {
            echo "Live publication must be dispatched from the main workflow ref." >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main

      - name: Resolve Marketplace identity from the source manifest
        id: identity
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          destination=$(ui/apps/vs-assistant/scripts/extension-identity.sh)
          echo "destination=${destination}" >> "$GITHUB_OUTPUT"

      - name: Setup UI
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.github/actions/ui-setup

      - name: Create release plan
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CREATE_LINEAGE: ${{ inputs.create_lineage }}
          SCHEDULED: ${{ steps.gate.outputs.scheduled }}
          DESTINATION: ${{ steps.identity.outputs.destination }}
        run: |
          set -euo pipefail
          args=(
            plan vs
            --channel nightly
            --ref HEAD
            --bump patch
            --main-ref origin/main
            --tag-prefix vs-assistant
            --destination "${DESTINATION}"
          )
          [[ -n "${VERSION}" ]] && args+=(--version "${VERSION}")
          [[ "${CREATE_LINEAGE}" == "true" ]] && args+=(--create-lineage)
          if [[ "${SCHEDULED}" == "true" ]]; then
            args+=(--scheduled --skip-if-no-changes)
          fi
          pnpm -s -F @poolsideai/release-helper find-version "${args[@]}" > "$RUNNER_TEMP/release-plan.json"

      - name: Refuse to overtake an incomplete release
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.github/actions/validate-release-reservation
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          plan-file: ${{ runner.temp }}/release-plan.json
          scheduled: ${{ steps.gate.outputs.scheduled }}

      - name: Export release plan
        if: steps.gate.outputs.proceed == 'true'
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          action=$(jq -r '.action' "$RUNNER_TEMP/release-plan.json")
          version=$(jq -r '.version // ""' "$RUNNER_TEMP/release-plan.json")
          needs_release=false
          [[ "${action}" == "release" || "${action}" == "resume" ]] && needs_release=true
          {
            echo "action=${action}"
            echo "needs_release=${needs_release}"
            echo "release_sha=$(jq -r '.sourceSha' "$RUNNER_TEMP/release-plan.json")"
            echo "version=${version}"
            echo "tag=$(jq -r '.tag // ""' "$RUNNER_TEMP/release-plan.json")"
            echo "changelog_tag=$(jq -r '.changelogTag // ""' "$RUNNER_TEMP/release-plan.json")"
            echo "tag_annotation_base64=$(jq -r '(.tagAnnotation // "") | @base64' "$RUNNER_TEMP/release-plan.json")"
            echo "artifact_name=vs-assistant-${version}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Visual Studio release plan"
            echo '```json'
            jq . "$RUNNER_TEMP/release-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate prepared runtime inputs
        if: steps.plan.outputs.needs_release == 'true'
        shell: bash
        env:
          HELPER_TAG: ${{ inputs.helper_tag }}
          HELPER_VERSION: ${{ inputs.helper_version }}
        run: |
          set -euo pipefail
          [[ -n "${HELPER_VERSION}" ]] || {
            echo "The caller must provide helper_version from its prepared runtime." >&2
            exit 1
          }
          [[ -n "${HELPER_TAG}" ]] || {
            echo "Live publication requires the caller's immutable helper_tag." >&2
            exit 1
          }

      - name: Require the dispatch-time main tip for a new live release
        if: steps.gate.outputs.proceed == 'true' && steps.plan.outputs.action == 'release'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" == "${DISPATCH_SHA}" ]] || {
            echo "A new live release must use the main commit that started this workflow (${DISPATCH_SHA})." >&2
            exit 1
          }

  # The VSIX payload — the stamped manifests, the assistant/ACP webview bundle,
  # the pinned helper, and the release notes — is produced off Windows. The
  # csproj pulls the bundle and helper in through wildcards that fail open, so
  # the packaging job asserts on the built VSIX.
  payload:
    name: Webview and helper
    needs: plan
    if: needs.plan.outputs.needs_release == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout planned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0

      - name: Setup UI
        uses: ./.github/actions/ui-setup

      - name: Stamp release manifest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: pnpm -F @poolsideai/vs-assistant make-release-manifest --version "${VERSION}" --channel "${CHANNEL}"

      - name: Build webview
        run: pnpm exec turbo build --filter=@poolsideai/vs-assistant

      - name: Download pinned helper
        env:
          GH_REPO: ${{ github.repository }}
          POOLSIDE_HELPER_VERSION: ${{ inputs.helper_tag }}
        run: pnpm -F @poolsideai/vs-assistant download:binaries

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          CHANGELOG_TAG: ${{ needs.plan.outputs.changelog_tag }}
        run: |
          set -euo pipefail
          mkdir -p ui/apps/vs-assistant/release-notes
          args=(changelog vs --head "${RELEASE_SHA}")
          [[ -n "${CHANGELOG_TAG}" ]] && args+=(--prev "${CHANGELOG_TAG}")
          pnpm -s -F @poolsideai/release-helper find-version "${args[@]}" \
            > ui/apps/vs-assistant/release-notes/notes.md
          pnpm -s -F @poolsideai/release-helper find-version "${args[@]}" --slack \
            > ui/apps/vs-assistant/release-notes/slack.txt

      # The archive is rooted at the extension directory, so the Windows job
      # restores the stamped manifests straight over its own checkout.
      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.artifact_name }}-payload
          path: |
            ui/apps/vs-assistant/app/dist
            ui/apps/vs-assistant/app/package.json
            ui/apps/vs-assistant/helper/poolside-helper.exe
            ui/apps/vs-assistant/source.extension.vsixmanifest
            ui/apps/vs-assistant/ReleaseNotes.html
            ui/apps/vs-assistant/release-notes
          if-no-files-found: error
          retention-days: 1

  vsix:
    name: Build VSIX
    needs: [plan, payload]
    if: needs.plan.outputs.needs_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout planned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}

      - name: Download payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.plan.outputs.artifact_name }}-payload
          path: ui/apps/vs-assistant

      - name: Setup NuGet
        uses: NuGet/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0

      - name: Restore NuGet packages
        run: nuget restore ui/apps/vs-assistant/poolside-assistant.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build solution
        run: msbuild ui/apps/vs-assistant/poolside-assistant.sln /p:Configuration=Release

      # The packaging wildcards fail open, so assert on the built VSIX rather
      # than on the inputs: the runtime-resolved webview and helper paths, the
      # webview assets, and the stamped release version.
      - name: Verify VSIX contents
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vsix = 'ui/apps/vs-assistant/bin/Release/net472/poolside-assistant.vsix'
          if (-not (Test-Path $vsix)) {
            throw "No VSIX at $vsix"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsix))
          try {
            $entries = $archive.Entries.FullName
            $manifestEntry = $archive.GetEntry('extension.vsixmanifest')
            if ($null -eq $manifestEntry) {
              throw 'VSIX is missing extension.vsixmanifest'
            }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try {
              $packagedManifest = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
          } finally {
            $archive.Dispose()
          }

          Write-Host "VSIX entries: $($entries.Count)"

          $required = @(
            'app/dist/assistant.html'
            'app/dist/acp-chat.html'
            'helper/poolside-helper.exe'
          )
          $missing = @($required | Where-Object { $entries -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "VSIX is missing required entries: $($missing -join ', ')"
          }

          $assets = @($entries | Where-Object { $_ -like 'app/dist/assets/*' })
          Write-Host "Webview asset entries: $($assets.Count)"
          if ($assets.Count -eq 0) {
            throw 'VSIX contains no webview assets'
          }

          [xml]$manifestXml = $packagedManifest
          $identity = $manifestXml.PackageManifest.Metadata.Identity
          if ($identity.Version -ne $env:VERSION) {
            throw "VSIX version $($identity.Version) does not match planned version $env:VERSION"
          }

      - name: Stage release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-artifacts
          cp ui/apps/vs-assistant/bin/Release/net472/poolside-assistant.vsix \
            "release-artifacts/vs-assistant-${VERSION}.vsix"
          cp ui/apps/vs-assistant/release-notes/notes.md release-artifacts/
          cp ui/apps/vs-assistant/release-notes/slack.txt release-artifacts/
          (cd release-artifacts && sha256sum ./*.vsix > checksums.txt)

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [plan, vsix]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.vsix.result == 'success'
    runs-on: ubuntu-latest
    environment: vs-${{ needs.plan.outputs.channel }}-release
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout planned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifacts

      - name: Create or verify immutable tag
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          TAG_ANNOTATION_BASE64: ${{ needs.plan.outputs.tag_annotation_base64 }}
          RELEASE_GIT_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${TAG_ANNOTATION_BASE64}" ]] || {
            echo "Managed Visual Studio releases require tag annotation metadata." >&2
            exit 1
          }
          expected_annotation=$(printf '%s' "${TAG_ANNOTATION_BASE64}" | base64 --decode | jq -S -c .)

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            existing=$(git rev-list -n 1 "${TAG}")
            [[ "${existing}" == "${RELEASE_SHA}" ]] || {
              echo "${TAG} points to ${existing}, expected ${RELEASE_SHA}" >&2
              exit 1
            }
            object_type=$(git cat-file -t "refs/tags/${TAG}")
            [[ "${object_type}" == "tag" ]] || {
              echo "${TAG} is a lightweight tag and has no immutable lineage association." >&2
              exit 1
            }
            actual_annotation=$(git for-each-ref --format='%(contents:subject)' "refs/tags/${TAG}" | jq -S -c .)
            [[ "${actual_annotation}" == "${expected_annotation}" ]] || {
              echo "${TAG} annotation does not match the requested app identity or release source." >&2
              diff -u <(printf '%s\n' "${actual_annotation}") <(printf '%s\n' "${expected_annotation}") || true
              exit 1
            }
          else
            [[ -n "${RELEASE_GIT_TOKEN}" ]] || {
              echo "Creating ${TAG} requires the RELEASE_GIT_TOKEN repository secret with Contents and Workflows read/write access." >&2
              exit 1
            }
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${RELEASE_GIT_TOKEN}@github.com/${{ github.repository }}"
            git tag --annotate --message "${expected_annotation}" "${TAG}" "${RELEASE_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or reuse GitHub draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Reusing GitHub release ${TAG}."
          else
            gh release create "${TAG}" \
              --verify-tag \
              --draft \
              --title "${TAG}" \
              --notes-file release-artifacts/notes.md
          fi

      # A retry rebuilds the VSIX, and MSBuild output is not byte-reproducible.
      # Pinning the first artifact set to the draft keeps the bytes associated
      # with the immutable tag stable across attempts: a resumed run restores
      # the original set instead of uploading a divergent rebuild.
      - name: Pin immutable release artifacts
        id: pinned
        uses: ./.github/actions/pin-release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ needs.plan.outputs.tag }}
          product: vs
          paths: release-artifacts
          allow-create: true

      - name: Attach assets and publish draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PINNED_ASSET: ${{ steps.pinned.outputs.asset-name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" release-artifacts/*.vsix \
            release-artifacts/checksums.txt --clobber
          gh release edit "${TAG}" --draft=false --prerelease --latest=false
          gh release delete-asset "${TAG}" "${PINNED_ASSET}" --yes || \
            echo "Warning: published release still contains internal pinned artifact ${PINNED_ASSET}."

  notify:
    name: Notify
    needs: [plan, payload, vsix, publish]
    if: >-
      always() &&
      github.repository == 'poolsideai/assistant'
    runs-on: ubuntu-latest
    steps:
      - name: Determine terminal outcome
        id: outcome
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          PAYLOAD: ${{ needs.payload.result }}
          VSIX: ${{ needs.vsix.result }}
          PUBLISH: ${{ needs.publish.result }}
          NEEDS_RELEASE: ${{ needs.plan.outputs.needs_release }}
        run: |
          set -euo pipefail
          if [[ "${PLAN}" == "failure" || "${PAYLOAD}" == "failure" || "${VSIX}" == "failure" || "${PUBLISH}" == "failure" ]]; then
            status=failure
            notify=true
          elif [[ "${PLAN}" == "cancelled" || "${PAYLOAD}" == "cancelled" || "${VSIX}" == "cancelled" || "${PUBLISH}" == "cancelled" ]]; then
            status=cancelled
            notify=true
          elif [[ "${NEEDS_RELEASE}" == "true" && "${PUBLISH}" == "success" ]]; then
            status=success
            notify=true
          else
            status=success
            notify=false
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "notify=${notify}" >> "$GITHUB_OUTPUT"

      - name: Checkout notification action
        if: steps.outcome.outputs.notify == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download changelog
        if: steps.outcome.outputs.notify == 'true' && needs.vsix.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifacts

      - name: Post terminal outcome
        if: steps.outcome.outputs.notify == 'true'
        uses: ./.github/actions/notify-release-slack
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          status: ${{ steps.outcome.outputs.status }}
          app: Visual Studio
          tag: ${{ needs.plan.outputs.tag }}
          changelog-file: release-artifacts/slack.txt
          channel: ${{ needs.plan.outputs.channel }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          trigger: ${{ inputs.trigger || github.event_name }}
