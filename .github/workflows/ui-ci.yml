name: UI CI
on:
  push:
    paths:
      - ui/**
      - scripts/ui/**
      - .github/workflows/ui-ci.yml
      - .github/workflows/release-*.yml
      - .github/workflows/validate-*-release.yml
      - .github/actions/**
      - package.json
      - pnpm-*.yaml
    branches:
      - main
  # Required checks must report on every PR, including documentation-only changes.
  pull_request:

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  workflow_lint:
    name: Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  affected:
    timeout-minutes: 15
    # Canonical repo runs on the assistants group's GitHub-hosted 4-core runner;
    # any other repo (forks) falls back to standard ubuntu-24.04 — a free 4-core once
    # the repo is public. The 4-core box roughly halves these jobs vs the 2-core default
    # (Build ~5.5m vs ~9m) and keeps --concurrency=50% at 2 rather than collapsing to 1.
    # Actionlint cannot validate the organization-specific runner label.
    runs-on: ${{ github.repository == 'poolsideai/assistants' && 'assistants-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    name: ${{ matrix.name }}
    env:
      GH_TOKEN: ${{ github.token }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            script: check:format
          - name: Lint
            script: check:lint:ci
          - name: Typecheck
            script: check:types
          - name: Build
            script: build --concurrency=50%
          - name: Test
            script: test:unit

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/ui-setup

      - name: ${{ matrix.name }}
        run: pnpm ${{ matrix.script }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          SKIP_DESKTOP_TAURI_BUILD: ${{ matrix.name == 'Build' && '1' || '' }}

      - name: Visualization navigation regressions
        if: matrix.name == 'Test'
        run: |
          pnpm -F @poolsideai/desktop-assistant exec vitest run --project unit src/externalLinks.test.ts
          pnpm -F @poolsideai/components exec playwright install --with-deps chromium
          pnpm -F @poolsideai/components test:storybook src/lib/components/markdown/Visualization.stories.svelte
