# simplest possible smoke for now
__POOL_SYNTHETIC_IMPORT_BASELINE__

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - 'cmd/poolside-helper/**'
      - 'pkg/poolside-helper/**'
      - '.github/workflows/product-binaries-smoke-test.yml'

jobs:
__POOL_SYNTHETIC_IMPORT_BASELINE__
    strategy:
      fail-fast: false
      matrix:
        os:
__POOL_SYNTHETIC_IMPORT_BASELINE__
__POOL_SYNTHETIC_IMPORT_BASELINE__
          - macos-14-large
__POOL_SYNTHETIC_IMPORT_BASELINE__
    runs-on: ${{ (github.repository != 'poolsideai/assistant' && matrix.os == 'macos-14-large') && 'macos-latest' || matrix.os }}

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    env:
__POOL_SYNTHETIC_IMPORT_BASELINE__
      XDG_STATE_HOME: ${{ github.workspace }}/.state

    steps:
      - name: Checkout repository
__POOL_SYNTHETIC_IMPORT_BASELINE__

      - name: Setup Go
__POOL_SYNTHETIC_IMPORT_BASELINE__
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          set -euo pipefail
          ext=""
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then ext=".exe"; fi

__POOL_SYNTHETIC_IMPORT_BASELINE__
          echo "HELPER_BIN=$PWD/poolside-helper${ext}" >> "$GITHUB_ENV"

      # the simplest of smoke tests fow now: does it start without crashing
__POOL_SYNTHETIC_IMPORT_BASELINE__
        # shouldn't be slow
        timeout-minutes: 5
        run: |
          set -euo pipefail
          
          "$HELPER_BIN" \
            --help \
            2>&1 | tee helper-run.log
            
      - name: Upload artifacts
        if: always()
__POOL_SYNTHETIC_IMPORT_BASELINE__
        with:
          name: history-${{ matrix.os }}
          path: |
            *-run.log
__POOL_SYNTHETIC_IMPORT_BASELINE__
