name: Publish helper runtime

on:
  workflow_call:
    inputs:
      action:
        description: "Planner action (release, resume, or reuse)"
        required: true
        type: string
      source_sha:
        description: "Exact source commit used to build the runtime"
        required: true
        type: string
      tag:
        description: "Permanent helper release tag"
        required: true
        type: string
      tag_annotation_base64:
        description: "Base64-encoded immutable helper tag metadata"
        required: true
        type: string
      version:
        description: "Numeric helper version embedded in the binaries"
        required: true
        type: string
    secrets:
      RELEASE_GIT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish permanent helper release
    if: github.repository == 'poolsideai/assistants'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Download built runtime
        if: inputs.action != 'reuse'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: artifact-poolside-*
          path: helper-release
          merge-multiple: true

      - name: Download immutable published runtime
        if: inputs.action == 'reuse'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-helper-runtime.sh "${{ inputs.tag }}" helper-release

      - name: Verify complete runtime
        shell: bash
        run: bash scripts/verify-helper-runtime.sh helper-release

      - name: Create or verify immutable helper tag
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_GIT_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
          TAG_ANNOTATION_BASE64: ${{ inputs.tag_annotation_base64 }}
        run: |
          set -euo pipefail
          expected_annotation=$(printf '%s' "${TAG_ANNOTATION_BASE64}" | base64 --decode | jq -S -c .)

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            existing=$(git rev-list -n 1 "${TAG}")
            [[ "${existing}" == "${SOURCE_SHA}" ]] || {
              echo "${TAG} points to ${existing}, expected ${SOURCE_SHA}" >&2
              exit 1
            }
            object_type=$(git cat-file -t "refs/tags/${TAG}")
            if [[ "${object_type}" == "tag" ]]; then
              actual_annotation=$(git for-each-ref --format='%(contents:subject)' "refs/tags/${TAG}" | jq -S -c .)
              [[ "${actual_annotation}" == "${expected_annotation}" ]] || {
                echo "${TAG} annotation does not match its helper release plan." >&2
                exit 1
              }
            elif [[ "${ACTION}" != "reuse" ]]; then
              echo "${TAG} is a legacy lightweight tag and cannot reserve a new helper release." >&2
              exit 1
            fi
          else
            [[ -n "${RELEASE_GIT_TOKEN}" ]] || {
              echo "Creating ${TAG} requires RELEASE_GIT_TOKEN." >&2
              exit 1
            }
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${RELEASE_GIT_TOKEN}@github.com/${{ github.repository }}"
            git tag --annotate --message "${expected_annotation}" "${TAG}" "${SOURCE_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or verify permanent GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN || github.token }}
          RELEASE_GIT_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          expected_assets=$(find helper-release -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.checksum' \) \
            -exec basename {} \; | sort)

          if gh release view "${TAG}" --json assets,isDraft > "$RUNNER_TEMP/helper-release.json" 2>/dev/null; then
            actual_assets=$(jq -r '.assets[].name' "$RUNNER_TEMP/helper-release.json" | sort)
            if jq -e '.isDraft == false' "$RUNNER_TEMP/helper-release.json" >/dev/null; then
              [[ "${actual_assets}" == "${expected_assets}" ]] || {
                echo "Published helper release ${TAG} has an unexpected immutable asset set." >&2
                diff -u <(printf '%s\n' "${expected_assets}") <(printf '%s\n' "${actual_assets}") || true
                exit 1
              }
              echo "Reusing permanent helper release ${TAG}."
              exit 0
            fi
            echo "Resuming helper draft ${TAG}."
          else
            [[ -n "${RELEASE_GIT_TOKEN}" ]] || {
              echo "Publishing ${TAG} requires RELEASE_GIT_TOKEN." >&2
              exit 1
            }
            {
              echo "Runtime built and signed from \`${SOURCE_SHA}\`."
              echo
              echo "This helper release is produced by the product release pipeline and is the"
              echo "durable source for VS Code, Desktop, Visual Studio, and local binary downloads."
            } > "$RUNNER_TEMP/helper-notes.md"
            gh release create "${TAG}" \
              --verify-tag \
              --draft \
              --title "poolside-helper ${VERSION}" \
              --notes-file "$RUNNER_TEMP/helper-notes.md"
          fi

          gh release upload "${TAG}" --clobber \
            helper-release/*.tar.gz \
            helper-release/*.checksum
          gh release view "${TAG}" --json assets,isDraft > "$RUNNER_TEMP/helper-release.json"
          actual_assets=$(jq -r '.assets[].name' "$RUNNER_TEMP/helper-release.json" | sort)
          [[ "${actual_assets}" == "${expected_assets}" ]] || {
            echo "Helper draft ${TAG} is missing required assets." >&2
            diff -u <(printf '%s\n' "${expected_assets}") <(printf '%s\n' "${actual_assets}") || true
            exit 1
          }
          jq -e '.isDraft == true' "$RUNNER_TEMP/helper-release.json" >/dev/null
          gh release edit "${TAG}" --draft=false --latest=false
