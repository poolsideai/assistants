name: Validate · VS Code release

on:
  workflow_dispatch:
    inputs:
      bootstrap_version:
        description: "Exact first version to rehearse (blank for normal validation)"
        required: false
        type: string
      release:
        description: "Release type"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable-patch
          - stable-minor
          - stable-major
      sync_versions:
        description: "Align with the highest VS Code/Desktop version"
        required: true
        default: true
        type: boolean

permissions:
  # Reusable workflows cannot request more permission than their caller. The
  # called workflow contains publish jobs with contents: write, although the
  # hard-coded dry_run input prevents those jobs from running here.
  contents: write
  packages: read

jobs:
  runtime:
    name: Build validation runtime
    uses: ./.github/workflows/helper-build.yml
    with:
      ref: ${{ github.sha }}
      version: 0.0.0
      sign: false

  validate:
    needs: runtime
    uses: ./.github/workflows/release-vscode.yml
    with:
      release: ${{ inputs.release }}
      sync_versions: ${{ inputs.sync_versions }}
      version: ${{ inputs.bootstrap_version }}
      create_lineage: ${{ inputs.bootstrap_version != '' }}
      dry_run: true
      helper_version: 0.0.0
