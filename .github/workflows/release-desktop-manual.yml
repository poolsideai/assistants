name: Release · Desktop

# Manual one-product entry point for the shared release coordinator.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release type"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable-patch
          - stable-minor
          - stable-major
      sync_versions:
        description: "Align with the highest VS Code/Desktop/Visual Studio version"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Release Desktop
    uses: ./.github/workflows/release-products.yml
    with:
      release: ${{ inputs.release }}
      vscode: false
      desktop: true
      sync_versions: ${{ inputs.sync_versions }}
    secrets: inherit
