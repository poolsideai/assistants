name: Build VSIX

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vs-extension-dev-check.yml'
      - 'ui/apps/vs-assistant/**'
  pull_request:
    paths:
      - '.github/workflows/vs-extension-dev-check.yml'
      - 'ui/apps/vs-assistant/**'

permissions:
  contents: read

jobs:
  # The VSIX payload — the assistant/ACP webview bundle and the Windows helper —
  # is produced off Windows, exactly as a local `pnpm build` plus
  # `pnpm run download:binaries` would. Without it MSBuild still succeeds: the
  # csproj pulls both in through wildcards (`app\dist\*.*`, `helper\*.exe`) that
  # match nothing and package silently, so the VSIX would be a shell.
  payload:
    name: Webview and helper
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # A full install, as in UI CI: the build below is driven by the root
      # `turbo`, which a `--filter`ed install is not guaranteed to bring in.
      - name: Setup
        uses: ./.github/actions/ui-setup

      - name: Build webview
        run: pnpm exec turbo build --filter=@poolsideai/vs-assistant

      - name: Download helper
        env:
          GH_TOKEN: ${{ github.token }}
          # The helper/v* lineage lives in the canonical repository, so a fork's
          # run resolves and downloads the same published release rather than
          # looking for one of its own.
          GH_REPO: poolsideai/assistant
        run: pnpm -F @poolsideai/vs-assistant download:binaries

      # The archive is rooted at the least common ancestor of the paths below,
      # which is the extension directory — so the Windows job restores both
      # parts straight back into the layout the csproj expects. A path from
      # outside that directory would move the root up and silently land the
      # download somewhere else.
      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vs-assistant-payload
          path: |
            ui/apps/vs-assistant/app/dist
            ui/apps/vs-assistant/helper/poolside-helper.exe
          if-no-files-found: error
          # Transport between the two jobs, consumed minutes later in the same
          # run. One day still covers re-running the failed job.
          retention-days: 1

  vsix:
    name: VSIX
    needs: payload
    runs-on: windows-latest
    steps:
      - name: Checkout repository
__POOL_SYNTHETIC_IMPORT_BASELINE__

      - name: Download payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: vs-assistant-payload
          path: ui/apps/vs-assistant

      - name: Setup NuGet
__POOL_SYNTHETIC_IMPORT_BASELINE__

      - name: Restore NuGet packages
        run: nuget restore ui/apps/vs-assistant/poolside-assistant.sln

      - name: Setup MSBuild
__POOL_SYNTHETIC_IMPORT_BASELINE__

      - name: Build solution
        run: msbuild ui/apps/vs-assistant/poolside-assistant.sln /p:Configuration=Release

      # The packaging wildcards fail open, so assert on the built VSIX rather
      # than on the inputs: an empty package is the failure this job exists to
      # catch, and it is indistinguishable from a good one by exit code alone.
      - name: Verify VSIX contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsix = 'ui/apps/vs-assistant/bin/Release/net472/poolside-assistant.vsix'
          if (-not (Test-Path $vsix)) {
            throw "No VSIX at $vsix"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsix))
          try {
            $entries = $archive.Entries.FullName
          } finally {
            $archive.Dispose()
          }

          Write-Host "VSIX entries: $($entries.Count)"

          # The paths the extension resolves at runtime, so the check fails on
          # the same thing the user would: WebViewRequestHandler serves
          # `poolside-app://app/<file>` out of `app\dist`, and HelperProcess
          # spawns `helper\poolside-helper.exe`. The two webview files and the
          # helper each arrive through a separate csproj wildcard, so any one of
          # them can go missing on its own.
          $required = @(
            'app/dist/assistant.html'
            'app/dist/acp-chat.html'
            'helper/poolside-helper.exe'
          )
          $missing = @($required | Where-Object { $entries -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "VSIX is missing required entries: $($missing -join ', ')"
          }

          # The bundles those entry points load come from a wildcard of their
          # own, so an otherwise complete package can still ship an empty app.
          $assets = @($entries | Where-Object { $_ -like 'app/dist/assets/*' })
          Write-Host "Webview asset entries: $($assets.Count)"
          if ($assets.Count -eq 0) {
            throw 'VSIX contains no webview assets'
          }

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poolside-assistant-vsix
          path: ui/apps/vs-assistant/bin/Release/net472/poolside-assistant.vsix
          if-no-files-found: error
          retention-days: 7
