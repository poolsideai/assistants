name: Publish · VS Code

# Product-only workflow; callers prepare the shared helper runtime first.
on:
  workflow_call:
    inputs:
      release:
        description: "Release type"
        required: false
        default: preview
        type: string
      sync_versions:
        description: "Align with the highest VS Code/Desktop version"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Build and validate without creating or publishing a release"
        required: false
        default: false
        type: boolean
      version:
        description: "Exact version selected by the product release coordinator"
        required: false
        type: string
      create_lineage:
        description: "Explicitly bootstrap the managed lineage at the supplied exact version"
        required: false
        default: false
        type: boolean
      helper_version:
        description: "Exact helper version built by the product release coordinator"
        required: false
        type: string
      helper_tag:
        description: "Permanent helper release consumed by product packaging"
        required: false
        type: string
      scheduled:
        description: "Apply scheduled Preview gates and no-change detection"
        required: false
        default: false
        type: boolean
      trigger:
        description: "Original Actions event for release notifications"
        required: false
        type: string
    secrets:
      RELEASE_GIT_TOKEN:
        required: false
      VSCODE_MARKETPLACE_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  plan:
    name: Plan
    if: github.repository == 'poolsideai/assistants'
    runs-on: ubuntu-latest
    outputs:
      needs_release: ${{ steps.plan.outputs.needs_release || 'false' }}
      action: ${{ steps.plan.outputs.action }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      channel: ${{ steps.gate.outputs.channel }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      changelog_tag: ${{ steps.plan.outputs.changelog_tag }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      extension_name: ${{ steps.identity.outputs.extension_name }}
      extension_display_name: ${{ steps.identity.outputs.extension_display_name }}
      destination: ${{ steps.identity.outputs.destination }}
      tag_annotation_base64: ${{ steps.plan.outputs.tag_annotation_base64 }}
    steps:
      - name: Check release gates
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCT_ENABLED: ${{ vars.VSCODE_RELEASES_ENABLED }}
          NIGHTLY_ENABLED: ${{ vars.NIGHTLY_RELEASES_ENABLED }}
          REQUESTED_RELEASE: ${{ inputs.release || 'preview' }}
          REQUESTED_SYNC_VERSIONS: ${{ inputs.sync_versions }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run || false }}
          REQUESTED_SCHEDULED: ${{ inputs.scheduled || false }}
        run: |
          set -euo pipefail
          release="${REQUESTED_RELEASE}"
          sync_versions="${REQUESTED_SYNC_VERSIONS:-false}"
          dry_run="${REQUESTED_DRY_RUN}"
          scheduled="${REQUESTED_SCHEDULED}"

          if [[ "${EVENT_NAME}" == "schedule" || "${scheduled}" == "true" ]]; then
            release="preview"
            sync_versions="false"
            scheduled=true
          fi

          case "${release}" in
            preview)
              channel="nightly"
              bump="patch"
              ;;
            stable-patch)
              channel="stable"
              bump="patch"
              ;;
            stable-minor)
              channel="stable"
              bump="minor"
              ;;
            stable-major)
              channel="stable"
              bump="major"
              ;;
            *)
              echo "Unknown VS Code release type: ${release}" >&2
              exit 1
              ;;
          esac

          {
            echo "channel=${channel}"
            echo "bump=${bump}"
            echo "sync_versions=${sync_versions}"
            echo "dry_run=${dry_run}"
            echo "scheduled=${scheduled}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${dry_run}" == "true" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${PRODUCT_ENABLED}" != "true" ]]; then
            if [[ "${scheduled}" == "true" ]]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "### VS Code schedule skipped: VSCODE_RELEASES_ENABLED is not true" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "VSCODE_RELEASES_ENABLED must be exactly true for publication." >&2
            exit 1
          fi
          if [[ "${channel}" == "nightly" && "${NIGHTLY_ENABLED}" != "true" ]]; then
            if [[ "${scheduled}" == "true" ]]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "### VS Code schedule skipped: NIGHTLY_RELEASES_ENABLED is not true" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "NIGHTLY_RELEASES_ENABLED must be exactly true for Preview publication." >&2
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve production Marketplace identity
        id: identity
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          EXTENSION_NAME: ${{ vars.VSCODE_EXTENSION_NAME }}
          EXTENSION_DISPLAY_NAME: ${{ vars.VSCODE_EXTENSION_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          tag_prefix="vscode-assistant"
          [[ -n "${EXTENSION_NAME}" ]] || { echo "VSCODE_EXTENSION_NAME is required" >&2; exit 1; }
          [[ -n "${EXTENSION_DISPLAY_NAME}" ]] || { echo "VSCODE_EXTENSION_DISPLAY_NAME is required" >&2; exit 1; }
          [[ "${EXTENSION_NAME}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            echo "VSCODE_EXTENSION_NAME must contain lowercase letters, digits, and hyphens." >&2
            exit 1
          }
          [[ "${EXTENSION_NAME}" != *-dev ]] || {
            echo "VSCODE_EXTENSION_NAME must not end in -dev; the runtime treats it as the dev-mode identity." >&2
            exit 1
          }
          [[ "${EXTENSION_NAME}" != "poolside-assistant" ]] || {
            echo "Refusing to publish the legacy extension identity." >&2
            exit 1
          }
          [[ "${EXTENSION_DISPLAY_NAME}" != *$'\n'* && "${EXTENSION_DISPLAY_NAME}" != *$'\r'* ]] || {
            echo "extension_display_name must be a single line." >&2
            exit 1
          }

          {
            echo "tag_prefix=${tag_prefix}"
            echo "extension_name=${EXTENSION_NAME}"
            echo "extension_display_name=${EXTENSION_DISPLAY_NAME}"
            echo "destination=poolside-ai.${EXTENSION_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate publication source
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.dry_run != 'true'
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/main" ]] || {
            echo "Live publication must be dispatched from the main workflow ref." >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup UI
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.github/actions/ui-setup

      - name: Create release plan
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          CHANNEL: ${{ steps.gate.outputs.channel }}
          BUMP: ${{ steps.gate.outputs.bump }}
          SYNC_VERSIONS: ${{ steps.gate.outputs.sync_versions }}
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
          VERSION: ${{ inputs.version }}
          CREATE_LINEAGE: ${{ inputs.create_lineage }}
          SCHEDULED: ${{ steps.gate.outputs.scheduled }}
          TAG_PREFIX: ${{ steps.identity.outputs.tag_prefix }}
          DESTINATION: ${{ steps.identity.outputs.destination }}
          EXTENSION_DISPLAY_NAME: ${{ steps.identity.outputs.extension_display_name }}
        run: |
          set -euo pipefail
          args=(
            plan vscode
            --channel "${CHANNEL}"
            --ref HEAD
            --bump "${BUMP}"
            --main-ref origin/main
            --tag-prefix "${TAG_PREFIX}"
            --destination "${DESTINATION}"
          )
          [[ -n "${VERSION}" ]] && args+=(--version "${VERSION}")
          [[ "${CREATE_LINEAGE}" == "true" ]] && args+=(--create-lineage)
          [[ -n "${EXTENSION_DISPLAY_NAME}" ]] && args+=(--display-name "${EXTENSION_DISPLAY_NAME}")
          [[ "${SYNC_VERSIONS}" == "true" ]] && args+=(--sync-versions)
          [[ "${DRY_RUN}" == "true" ]] && args+=(--dry-run --allow-divergent-ref)
          if [[ "${SCHEDULED}" == "true" ]]; then
            args+=(--scheduled --skip-if-no-changes)
          fi
          pnpm -s -F @poolsideai/release-helper find-version "${args[@]}" > "$RUNNER_TEMP/release-plan.json"

      - name: Refuse to overtake an incomplete release
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.dry_run != 'true'
        uses: ./.github/actions/validate-release-reservation
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          plan-file: ${{ runner.temp }}/release-plan.json
          scheduled: ${{ steps.gate.outputs.scheduled }}

      - name: Export release plan
        if: steps.gate.outputs.proceed == 'true'
        id: plan
        shell: bash
        env:
          TAG_PREFIX: ${{ steps.identity.outputs.tag_prefix }}
        run: |
          set -euo pipefail
          action=$(jq -r '.action' "$RUNNER_TEMP/release-plan.json")
          version=$(jq -r '.version // ""' "$RUNNER_TEMP/release-plan.json")
          needs_release=false
          [[ "${action}" == "release" || "${action}" == "resume" ]] && needs_release=true
          {
            echo "action=${action}"
            echo "needs_release=${needs_release}"
            echo "release_sha=$(jq -r '.sourceSha' "$RUNNER_TEMP/release-plan.json")"
            echo "version=${version}"
            echo "tag=$(jq -r '.tag // ""' "$RUNNER_TEMP/release-plan.json")"
            echo "changelog_tag=$(jq -r '.changelogTag // ""' "$RUNNER_TEMP/release-plan.json")"
            echo "tag_annotation_base64=$(jq -r '(.tagAnnotation // "") | @base64' "$RUNNER_TEMP/release-plan.json")"
            echo "artifact_name=${TAG_PREFIX}-${version}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### VS Code release plan"
            echo '```json'
            jq . "$RUNNER_TEMP/release-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate prepared runtime inputs
        if: steps.plan.outputs.needs_release == 'true'
        shell: bash
        env:
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
          HELPER_TAG: ${{ inputs.helper_tag }}
          HELPER_VERSION: ${{ inputs.helper_version }}
        run: |
          set -euo pipefail
          [[ -n "${HELPER_VERSION}" ]] || {
            echo "The caller must provide helper_version from its prepared runtime." >&2
            exit 1
          }
          if [[ "${DRY_RUN}" != "true" && -z "${HELPER_TAG}" ]]; then
            echo "Live publication requires the caller's immutable helper_tag." >&2
            exit 1
          fi

      - name: Require the dispatch-time main tip for a new live release
        if: >-
          steps.gate.outputs.proceed == 'true' &&
          steps.gate.outputs.dry_run != 'true' &&
          steps.plan.outputs.action == 'release'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" == "${DISPATCH_SHA}" ]] || {
            echo "A new live release must use the main commit that started this workflow (${DISPATCH_SHA})." >&2
            exit 1
          }

      - name: Check Marketplace version availability before building
        if: >-
          steps.gate.outputs.proceed == 'true' &&
          steps.gate.outputs.dry_run != 'true' &&
          steps.plan.outputs.action == 'release'
        shell: bash
        env:
          EXTENSION_ID: ${{ steps.identity.outputs.destination }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          listing=$(pnpm -F ./ui/apps/vscode-assistant exec vsce show "${EXTENSION_ID}" --json)
          if [[ "${listing}" == "undefined" ]]; then
            exit 0
          fi
          printf '%s' "${listing}" | jq -e . >/dev/null
          if printf '%s' "${listing}" | jq -e --arg version "${VERSION}" \
            '(.versions // []) | any(.version == $version)' >/dev/null; then
            echo "${EXTENSION_ID} already contains ${VERSION}, but ${TAG} is not a resumable release." >&2
            exit 1
          fi
          highest=$(printf '%s' "${listing}" | jq -r '
            [
              .versions[]?.version
              | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              | split(".")
              | map(tonumber)
            ]
            | max // empty
            | if type == "array" then join(".") else empty end
          ')
          if [[ -n "${highest}" ]] && ! jq -en \
            --arg candidate "${VERSION}" \
            --arg highest "${highest}" \
            'def parts: split(".") | map(tonumber); ($candidate | parts) > ($highest | parts)' \
            >/dev/null; then
            echo "Planned VS Code version ${VERSION} must be newer than Marketplace maximum ${highest}." >&2
            exit 1
          fi

  build:
    name: Build and validate
    needs: plan
    if: needs.plan.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=4096
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
      CHANGELOG_TAG: ${{ needs.plan.outputs.changelog_tag }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      TAG: ${{ needs.plan.outputs.tag }}
      DESTINATION: ${{ needs.plan.outputs.destination }}
      TAG_ANNOTATION_BASE64: ${{ needs.plan.outputs.tag_annotation_base64 }}
    steps:
      - name: Checkout planned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0

      - name: Download temporary Actions runtime
        if: needs.plan.outputs.dry_run == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: artifact-poolside-*
          path: ${{ runner.temp }}/release-runtime
          merge-multiple: true

      - name: Download canonical release runtime
        if: needs.plan.outputs.dry_run != 'true'
        shell: bash
        env:
          HELPER_TAG: ${{ inputs.helper_tag }}
        run: bash scripts/download-helper-runtime.sh "${HELPER_TAG}" "$RUNNER_TEMP/release-runtime"

      - name: Setup UI
        uses: ./.github/actions/ui-setup

      - name: Stamp release manifest
        shell: bash
        env:
          EXTENSION_NAME: ${{ needs.plan.outputs.extension_name }}
          EXTENSION_DISPLAY_NAME: ${{ needs.plan.outputs.extension_display_name }}
        run: |
          set -euo pipefail
          args=(--version "${VERSION}")
          [[ -n "${EXTENSION_NAME}" ]] && args+=(--name "${EXTENSION_NAME}")
          [[ -n "${EXTENSION_DISPLAY_NAME}" ]] && args+=(--display-name "${EXTENSION_DISPLAY_NAME}")
          pnpm -F ./ui/apps/vscode-assistant make-release-manifest "${args[@]}"

      - name: Stamp changelog
        shell: bash
        run: |
          set -euo pipefail
          pnpm -s -F @poolsideai/release-helper find-version render-changelog vscode \
            --head "${RELEASE_SHA}" --version "${VERSION}"

      - name: Write immutable release provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TAG_ANNOTATION_BASE64}" ]] || {
            echo "Managed VS Code releases require tag annotation metadata." >&2
            exit 1
          }
          annotation=$(printf '%s' "${TAG_ANNOTATION_BASE64}" | base64 --decode)
          jq -n \
            --arg tag "${TAG}" \
            --arg source "${RELEASE_SHA}" \
            --arg destination "${DESTINATION}" \
            --arg version "${VERSION}" \
            --argjson lineage "${annotation}" \
            '{schema: 1, tag: $tag, source: $source, destination: $destination, version: $version, lineage: $lineage}' \
            > ui/apps/vscode-assistant/release-provenance.json

      - name: Build extension and workspace dependencies
        run: pnpm turbo build -F ./ui/apps/vscode-assistant

      - name: Verify packaged release assets
        run: pnpm -F ./ui/apps/vscode-assistant check:release-build

      - name: Retain release source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.artifact_name }}-sourcemaps
          path: |
            ui/apps/vscode-assistant/dist/**/*.map
            ui/apps/vscode-assistant/release-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Test release source
        run: |
          pnpm -F ./ui/apps/vscode-assistant test:unit
          pnpm -F ./ui/apps/vscode-assistant check:types

      - name: Package all targets
        shell: bash
        env:
          POOLSIDE_RUNTIME_ARTIFACT_DIR: ${{ runner.temp }}/release-runtime
          POOLSIDE_RUNTIME_VERSION: ${{ inputs.helper_version }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "${CHANNEL}" == "nightly" ]] && prerelease+=(--pre-release)
          rm -rf release-artifacts
          mkdir release-artifacts

          for target in darwin-x64 darwin-arm64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            rm -f ui/apps/vscode-assistant/dist/poolside-helper-* \
              ui/apps/vscode-assistant/dist/poolside-mlx-sidecar-* \
              ui/apps/vscode-assistant/dist/*.tar.gz
            pnpm -F ./ui/apps/vscode-assistant run download:binaries "${target}"
            pnpm -F ./ui/apps/vscode-assistant exec vsce package \
              --no-dependencies \
              --allow-missing-repository \
              --target "${target}" \
              "${prerelease[@]}" \
              --out "$(pwd)/release-artifacts/vscode-${VERSION}-${target}.vsix"
          done

          rm -f ui/apps/vscode-assistant/dist/poolside-helper-* \
            ui/apps/vscode-assistant/dist/poolside-mlx-sidecar-* \
            ui/apps/vscode-assistant/dist/*.tar.gz
          pnpm -F ./ui/apps/vscode-assistant run download:binaries
          pnpm -F ./ui/apps/vscode-assistant exec vsce package \
            --no-dependencies \
            --allow-missing-repository \
            "${prerelease[@]}" \
            --out "$(pwd)/release-artifacts/vscode-${VERSION}-universal.vsix"

      - name: Generate release notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          args=(changelog vscode --head "${RELEASE_SHA}")
          [[ -n "${CHANGELOG_TAG}" ]] && args+=(--prev "${CHANGELOG_TAG}")
          pnpm -s -F @poolsideai/release-helper find-version "${args[@]}" > release-artifacts/notes.md
          pnpm -s -F @poolsideai/release-helper find-version "${args[@]}" --slack > release-artifacts/slack.txt
          cp ui/apps/vscode-assistant/release-provenance.json release-artifacts/provenance.json
          (cd release-artifacts && sha256sum ./*.vsix > checksums.txt)

      - name: Verify packaged identities and provenance
        uses: ./.github/actions/verify-vscode-marketplace
        with:
          mode: artifacts
          release-action: ${{ needs.plan.outputs.action }}
          extension-id: ${{ needs.plan.outputs.destination }}
          version: ${{ needs.plan.outputs.version }}
          channel: ${{ needs.plan.outputs.channel }}
          provenance-file: release-artifacts/provenance.json

      - name: Upload build-only artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifacts
          retention-days: 14

  publish:
    name: Publish Marketplace targets
    needs: [plan, build]
    # Orchestrated runs intentionally skip the nested runtime jobs. Override
    # GitHub's implicit success() so those transitive skips do not block publish.
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.dry_run != 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: vscode-${{ needs.plan.outputs.channel }}-release
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout planned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup UI
        uses: ./.github/actions/ui-setup

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifacts

      - name: Reverify packaged identities and provenance
        uses: ./.github/actions/verify-vscode-marketplace
        with:
          mode: artifacts
          release-action: ${{ (needs.plan.outputs.action == 'resume' || github.run_attempt > 1) && 'resume' || 'release' }}
          extension-id: ${{ needs.plan.outputs.destination }}
          version: ${{ needs.plan.outputs.version }}
          channel: ${{ needs.plan.outputs.channel }}
          provenance-file: release-artifacts/provenance.json

      - name: Verify Marketplace access
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/vsce-verify-pat.log"
          for attempt in 1 2; do
            if pnpm -F ./ui/apps/vscode-assistant exec vsce verify-pat poolside-ai 2>&1 | tee "${log}"; then
              exit 0
            fi
            if ! grep -Fq "Request timeout:" "${log}" || [[ "${attempt}" -eq 2 ]]; then
              exit 1
            fi
            echo "Marketplace PAT verification timed out; retrying in 15 seconds."
            sleep 15
          done

      - name: Revalidate Marketplace collision and provenance
        uses: ./.github/actions/verify-vscode-marketplace
        with:
          mode: preflight
          release-action: ${{ (needs.plan.outputs.action == 'resume' || github.run_attempt > 1) && 'resume' || 'release' }}
          extension-id: ${{ needs.plan.outputs.destination }}
          version: ${{ needs.plan.outputs.version }}
          channel: ${{ needs.plan.outputs.channel }}
          provenance-file: release-artifacts/provenance.json

      - name: Create or verify immutable tag
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          TAG_ANNOTATION_BASE64: ${{ needs.plan.outputs.tag_annotation_base64 }}
          RELEASE_GIT_TOKEN: ${{ secrets.RELEASE_GIT_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${TAG_ANNOTATION_BASE64}" ]] || {
            echo "Managed VS Code releases require tag annotation metadata." >&2
            exit 1
          }
          expected_annotation=$(printf '%s' "${TAG_ANNOTATION_BASE64}" | base64 --decode | jq -S -c .)

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            existing=$(git rev-list -n 1 "${TAG}")
            [[ "${existing}" == "${RELEASE_SHA}" ]] || {
              echo "${TAG} points to ${existing}, expected ${RELEASE_SHA}" >&2
              exit 1
            }
            object_type=$(git cat-file -t "refs/tags/${TAG}")
            [[ "${object_type}" == "tag" ]] || {
              echo "${TAG} is a lightweight tag and has no immutable lineage association." >&2
              exit 1
            }
            actual_annotation=$(git for-each-ref --format='%(contents:subject)' "refs/tags/${TAG}" | jq -S -c .)
            [[ "${actual_annotation}" == "${expected_annotation}" ]] || {
              echo "${TAG} annotation does not match the requested app identity or release source." >&2
              diff -u <(printf '%s\n' "${actual_annotation}") <(printf '%s\n' "${expected_annotation}") || true
              exit 1
            }
          else
            [[ -n "${RELEASE_GIT_TOKEN}" ]] || {
              echo "Creating ${TAG} requires the RELEASE_GIT_TOKEN repository secret with Contents and Workflows read/write access." >&2
              exit 1
            }
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${RELEASE_GIT_TOKEN}@github.com/${{ github.repository }}"
            git tag --annotate --message "${expected_annotation}" "${TAG}" "${RELEASE_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or reuse GitHub draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Reusing GitHub release ${TAG}."
          else
            gh release create "${TAG}" \
              --verify-tag \
              --draft \
              --title "${TAG}" \
              --notes-file release-artifacts/notes.md
          fi

      - name: Pin immutable release artifacts
        uses: ./.github/actions/pin-release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ needs.plan.outputs.tag }}
          product: vscode
          paths: release-artifacts
          allow-create: true

      - name: Publish missing targets
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          ACTION: ${{ needs.plan.outputs.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          prerelease=()
          duplicate=()
          [[ "${CHANNEL}" == "nightly" ]] && prerelease+=(--pre-release)
          if [[ "${ACTION}" == "resume" ]] || (( RUN_ATTEMPT > 1 )); then
            duplicate+=(--skip-duplicate)
          fi
          for vsix in release-artifacts/*.vsix; do
            pnpm -F ./ui/apps/vscode-assistant exec vsce publish \
              --allow-all-proposed-apis \
              "${duplicate[@]}" \
              "${prerelease[@]}" \
              --packagePath "$(realpath "${vsix}")"
          done

  finalize:
    name: Finalize GitHub release
    needs: [plan, build, publish]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.build.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout planned source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}

      - name: Restore immutable release artifacts
        id: pinned
        uses: ./.github/actions/pin-release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ needs.plan.outputs.tag }}
          product: vscode
          paths: release-artifacts
          allow-create: false

      - name: Attach assets and publish draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs the repo spelled out.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          PINNED_ASSET: ${{ steps.pinned.outputs.asset-name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" release-artifacts/*.vsix \
            release-artifacts/checksums.txt release-artifacts/provenance.json --clobber
          if [[ "${CHANNEL}" == "nightly" ]]; then
            gh release edit "${TAG}" --draft=false --prerelease --latest=false
          else
            gh release edit "${TAG}" --draft=false --prerelease=false --latest=false
          fi
          gh release delete-asset "${TAG}" "${PINNED_ASSET}" --yes || \
            echo "Warning: published release still contains internal pinned artifact ${PINNED_ASSET}."

  notify:
    name: Notify
    needs: [plan, build, publish, finalize]
    if: >-
      always() &&
      github.repository == 'poolsideai/assistants'
    runs-on: ubuntu-latest
    steps:
      - name: Determine terminal outcome
        id: outcome
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
          FINALIZE: ${{ needs.finalize.result }}
          NEEDS_RELEASE: ${{ needs.plan.outputs.needs_release }}
        run: |
          set -euo pipefail
          if [[ "${PLAN}" == "failure" || "${BUILD}" == "failure" || "${PUBLISH}" == "failure" || "${FINALIZE}" == "failure" ]]; then
            status=failure
            notify=true
          elif [[ "${PLAN}" == "cancelled" || "${BUILD}" == "cancelled" || "${PUBLISH}" == "cancelled" || "${FINALIZE}" == "cancelled" ]]; then
            status=cancelled
            notify=true
          elif [[ "${NEEDS_RELEASE}" == "true" && "${FINALIZE}" == "success" ]]; then
            status=success
            notify=true
          else
            status=success
            notify=false
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "notify=${notify}" >> "$GITHUB_OUTPUT"

      - name: Checkout notification action
        if: steps.outcome.outputs.notify == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download changelog
        if: steps.outcome.outputs.notify == 'true' && needs.build.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: release-artifacts

      - name: Post terminal outcome
        if: steps.outcome.outputs.notify == 'true'
        uses: ./.github/actions/notify-release-slack
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          status: ${{ steps.outcome.outputs.status }}
          app: VS Code
          tag: ${{ needs.plan.outputs.tag }}
          changelog-file: release-artifacts/slack.txt
          channel: ${{ needs.plan.outputs.channel }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          trigger: ${{ inputs.trigger || github.event_name }}
