name: Release · Visual Studio

# Manual one-product entry point for the shared release coordinator. Only
# Preview (nightly) releases are automated; stable releases follow the manual
# process in ui/apps/vs-assistant/README.md.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release type"
        required: true
        default: preview
        type: choice
        options:
          - preview
      sync_versions:
        description: "Align with the highest VS Code/Desktop/Visual Studio version"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Release Visual Studio
    uses: ./.github/workflows/release-products.yml
    with:
      release: ${{ inputs.release }}
      vscode: false
      desktop: false
      vs: true
      sync_versions: ${{ inputs.sync_versions }}
    secrets: inherit
