name: Validate · CrabNebula CLI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/actions/setup-crabnebula-cli/**
      - .github/workflows/validate-crabnebula-cli.yml
  push:
    branches: [main]
    paths:
      - .github/actions/setup-crabnebula-cli/**
      - .github/workflows/validate-crabnebula-cli.yml

permissions:
  contents: read

jobs:
  install:
    name: Verify pinned CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download and verify pinned CLI
        id: cn
        uses: ./.github/actions/setup-crabnebula-cli

      - name: Check release commands without credentials
        shell: bash
        env:
          CN: ${{ steps.cn.outputs.path }}
        run: |
          set -euo pipefail
          "${CN}" release list --help
          "${CN}" release show --help
          "${CN}" release draft --help
          "${CN}" release upload --help
          "${CN}" release publish --help
