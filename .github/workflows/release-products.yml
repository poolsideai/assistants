name: Release · Products

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_call:
    inputs:
      bootstrap_version:
        description: "Exact first version after migration (blank for normal releases)"
        required: false
        type: string
      release:
        description: "Release type"
        required: true
        type: string
      vscode:
        description: "Release VS Code"
        required: true
        type: boolean
      desktop:
        description: "Release Desktop"
        required: true
        type: boolean
      vs:
        description: "Release Visual Studio"
        required: false
        default: false
        type: boolean
      sync_versions:
        description: "Give selected products the same exact version"
        required: true
        type: boolean
    secrets:
      ASC_KEY_P8_B64:
        required: false
      CN_API_KEY:
        required: false
      MACOS_DEVID_P12_B64:
        required: false
      MACOS_DEVID_P12_PASSWORD:
        required: false
      RELEASE_GIT_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      VSCODE_MARKETPLACE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      bootstrap_version:
        description: "Exact first version after migration (blank for normal releases)"
        required: false
        type: string
      release:
        description: "Release type"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable-patch
          - stable-minor
          - stable-major
      vscode:
        description: "Release VS Code"
        required: true
        default: true
        type: boolean
      desktop:
        description: "Release Desktop"
        required: true
        default: true
        type: boolean
      vs:
        description: "Release Visual Studio (nightly only)"
        required: true
        default: false
        type: boolean
      sync_versions:
        description: "Give selected products the same exact version"
        required: true
        default: true
        type: boolean

permissions:
  # Reusable release workflows cannot request more permission than their caller.
  contents: write
  packages: read

concurrency:
  group: release-products
  queue: max

jobs:
  plan:
    name: Plan release train
    if: github.repository == 'poolsideai/assistants'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      scheduled: ${{ steps.gate.outputs.scheduled }}
      sync_versions: ${{ steps.gate.outputs.sync_versions }}
      trigger: ${{ steps.gate.outputs.trigger }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      create_lineage: ${{ steps.plan.outputs.create_lineage }}
      helper_action: ${{ steps.helper.outputs.action }}
      helper_tag: ${{ steps.helper.outputs.tag }}
      helper_tag_annotation_base64: ${{ steps.helper.outputs.tag_annotation_base64 }}
      helper_version: ${{ steps.helper.outputs.version }}
      vscode: ${{ steps.plan.outputs.vscode || 'false' }}
      vscode_version: ${{ steps.plan.outputs.vscode_version }}
      desktop: ${{ steps.plan.outputs.desktop || 'false' }}
      desktop_version: ${{ steps.plan.outputs.desktop_version }}
      vs: ${{ steps.plan.outputs.vs || 'false' }}
      vs_version: ${{ steps.plan.outputs.vs_version }}
    steps:
      - name: Select products and release type
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RELEASE: ${{ inputs.release || 'preview' }}
          REQUESTED_VSCODE: ${{ inputs.vscode || false }}
          REQUESTED_DESKTOP: ${{ inputs.desktop || false }}
          REQUESTED_VS: ${{ inputs.vs || false }}
          REQUESTED_SYNC_VERSIONS: ${{ inputs.sync_versions }}
          VSCODE_ENABLED: ${{ vars.VSCODE_RELEASES_ENABLED }}
          DESKTOP_ENABLED: ${{ vars.DESKTOP_RELEASES_ENABLED }}
          VS_ENABLED: ${{ vars.VS_RELEASES_ENABLED }}
          NIGHTLY_ENABLED: ${{ vars.NIGHTLY_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          release="${REQUESTED_RELEASE}"
          vscode="${REQUESTED_VSCODE}"
          desktop="${REQUESTED_DESKTOP}"
          vs="${REQUESTED_VS}"
          sync_versions="${REQUESTED_SYNC_VERSIONS:-true}"
          scheduled=false

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            release=preview
            scheduled=true
            sync_versions=true
            vscode=false
            desktop=false
            vs=false
            [[ "${VSCODE_ENABLED}" == "true" ]] && vscode=true
            [[ "${DESKTOP_ENABLED}" == "true" ]] && desktop=true
            [[ "${VS_ENABLED}" == "true" ]] && vs=true
            if [[ "${NIGHTLY_ENABLED}" != "true" ]]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "### Product schedule skipped: NIGHTLY_RELEASES_ENABLED is not true" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [[ "${vs}" == "true" && "${release}" != "preview" ]]; then
            echo "Visual Studio stable releases are not automated yet; deselect it or use the manual process." >&2
            exit 1
          fi

          if [[ "${vscode}" != "true" && "${desktop}" != "true" && "${vs}" != "true" ]]; then
            if [[ "${scheduled}" == "true" ]]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "### Product schedule skipped: no product releases are enabled" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Select at least one product." >&2
            exit 1
          fi

          case "${release}" in
            preview)
              channel="nightly"
              bump="patch"
              ;;
            stable-patch)
              channel="stable"
              bump="patch"
              ;;
            stable-minor)
              channel="stable"
              bump="minor"
              ;;
            stable-major)
              channel="stable"
              bump="major"
              ;;
            *)
              echo "Unknown release type: ${release}" >&2
              exit 1
              ;;
          esac

          {
            echo "proceed=true"
            echo "release=${release}"
            echo "channel=${channel}"
            echo "bump=${bump}"
            echo "scheduled=${scheduled}"
            echo "sync_versions=${sync_versions}"
            echo "vscode=${vscode}"
            echo "desktop=${desktop}"
            echo "vs=${vs}"
            echo "trigger=${EVENT_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release source
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == "refs/heads/main" ]] || {
            echo "Product releases must be dispatched from the main workflow ref." >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup UI
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.github/actions/ui-setup

      - name: Create coordinated plan
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          CHANNEL: ${{ steps.gate.outputs.channel }}
          BUMP: ${{ steps.gate.outputs.bump }}
          SCHEDULED: ${{ steps.gate.outputs.scheduled }}
          SYNC_VERSIONS: ${{ steps.gate.outputs.sync_versions }}
          VSCODE: ${{ steps.gate.outputs.vscode }}
          DESKTOP: ${{ steps.gate.outputs.desktop }}
          VS: ${{ steps.gate.outputs.vs }}
          VSCODE_EXTENSION_NAME: ${{ vars.VSCODE_EXTENSION_NAME }}
          VSCODE_EXTENSION_DISPLAY_NAME: ${{ vars.VSCODE_EXTENSION_DISPLAY_NAME }}
          CN_APP_SLUG: ${{ vars.CN_APP_SLUG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            plan-products
            --channel "${CHANNEL}"
            --ref HEAD
            --bump "${BUMP}"
            --main-ref origin/main
          )
          if [[ "${VSCODE}" == "true" ]]; then
            args+=(
              --vscode
              --vscode-destination "poolside-ai.${VSCODE_EXTENSION_NAME}"
              --vscode-display-name "${VSCODE_EXTENSION_DISPLAY_NAME}"
            )
          fi
          if [[ "${DESKTOP}" == "true" ]]; then
            args+=(--desktop --desktop-destination "${CN_APP_SLUG}")
          fi
          if [[ "${VS}" == "true" ]]; then
            args+=(--vs --vs-destination "$(ui/apps/vs-assistant/scripts/extension-identity.sh)")
          fi
          [[ -n "${BOOTSTRAP_VERSION}" ]] && args+=(--bootstrap-version "${BOOTSTRAP_VERSION}")
          [[ "${SYNC_VERSIONS}" == "true" ]] && args+=(--sync-versions)
          [[ "${SCHEDULED}" == "true" ]] && args+=(--scheduled --skip-if-no-changes)
          pnpm -s -F @poolsideai/release-helper find-version "${args[@]}" > "$RUNNER_TEMP/product-release-plan.json"

      - name: Export coordinated plan
        if: steps.gate.outputs.proceed == 'true'
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "create_lineage=$(jq -r '.bootstrapVersion != null' "$RUNNER_TEMP/product-release-plan.json")"
            echo "source_sha=$(jq -r '.sourceSha' "$RUNNER_TEMP/product-release-plan.json")"
            echo "vscode=$(jq -r '.activeProducts | index("vscode") != null' "$RUNNER_TEMP/product-release-plan.json")"
            echo "vscode_version=$(jq -r '.versions.vscode // ""' "$RUNNER_TEMP/product-release-plan.json")"
            echo "desktop=$(jq -r '.activeProducts | index("desktop") != null' "$RUNNER_TEMP/product-release-plan.json")"
            echo "desktop_version=$(jq -r '.versions.desktop // ""' "$RUNNER_TEMP/product-release-plan.json")"
            echo "vs=$(jq -r '.activeProducts | index("vs") != null' "$RUNNER_TEMP/product-release-plan.json")"
            echo "vs_version=$(jq -r '.versions.vs // ""' "$RUNNER_TEMP/product-release-plan.json")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Coordinated product release plan"
            echo '```json'
            jq . "$RUNNER_TEMP/product-release-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create helper release plan
        id: helper
        if: >-
          steps.plan.outputs.vscode == 'true' ||
          steps.plan.outputs.desktop == 'true' ||
          steps.plan.outputs.vs == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm -s -F @poolsideai/release-helper find-version \
            plan-helper \
            --ref "${{ steps.plan.outputs.source_sha }}" \
            --main-ref origin/main \
            > "$RUNNER_TEMP/helper-release-plan.json"
          {
            echo "action=$(jq -r '.action' "$RUNNER_TEMP/helper-release-plan.json")"
            echo "tag=$(jq -r '.tag' "$RUNNER_TEMP/helper-release-plan.json")"
            echo "tag_annotation_base64=$(jq -r '.tagAnnotation | @base64' "$RUNNER_TEMP/helper-release-plan.json")"
            echo "version=$(jq -r '.version' "$RUNNER_TEMP/helper-release-plan.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Helper release plan"
            echo '```json'
            jq . "$RUNNER_TEMP/helper-release-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  runtime:
    name: Build signed release runtime
    needs: plan
    if: >-
      (needs.plan.outputs.vscode == 'true' || needs.plan.outputs.desktop == 'true' || needs.plan.outputs.vs == 'true') &&
      needs.plan.outputs.helper_action != 'reuse'
    uses: ./.github/workflows/helper-build.yml
    with:
      ref: ${{ needs.plan.outputs.source_sha }}
      version: ${{ needs.plan.outputs.helper_version }}
      sign: true
    secrets: inherit

  helper-release:
    name: Publish helper runtime
    needs: [plan, runtime]
    if: >-
      always() &&
      (needs.plan.outputs.vscode == 'true' || needs.plan.outputs.desktop == 'true' || needs.plan.outputs.vs == 'true') &&
      (
        needs.plan.outputs.helper_action == 'reuse' ||
        needs.runtime.result == 'success'
      )
    uses: ./.github/workflows/helper-publish.yml
    with:
      action: ${{ needs.plan.outputs.helper_action }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      tag: ${{ needs.plan.outputs.helper_tag }}
      tag_annotation_base64: ${{ needs.plan.outputs.helper_tag_annotation_base64 }}
      version: ${{ needs.plan.outputs.helper_version }}
    secrets: inherit

  notify-runtime-failure:
    name: Notify runtime failure
    needs: [plan, runtime, helper-release]
    if: >-
      always() &&
      (needs.plan.outputs.vscode == 'true' || needs.plan.outputs.desktop == 'true' || needs.plan.outputs.vs == 'true') &&
      (
        needs.runtime.result == 'failure' ||
        needs.runtime.result == 'cancelled' ||
        needs.helper-release.result == 'failure' ||
        needs.helper-release.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Post runtime failure
        uses: ./.github/actions/notify-release-slack
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          status: ${{ (needs.helper-release.result == 'failure' || needs.helper-release.result == 'cancelled') && needs.helper-release.result || needs.runtime.result }}
          app: Product runtime
          channel: ${{ needs.plan.outputs.release == 'preview' && 'nightly' || 'stable' }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          trigger: ${{ needs.plan.outputs.trigger }}

  vscode:
    name: VS Code
    needs: [plan, runtime, helper-release]
    if: >-
      always() &&
      needs.plan.outputs.vscode == 'true' &&
      needs.helper-release.result == 'success' &&
      (
        needs.plan.outputs.helper_action == 'reuse' ||
        needs.runtime.result == 'success'
      )
    uses: ./.github/workflows/release-vscode.yml
    with:
      release: ${{ needs.plan.outputs.release }}
      sync_versions: ${{ needs.plan.outputs.sync_versions == 'true' }}
      version: ${{ needs.plan.outputs.vscode_version }}
      create_lineage: ${{ needs.plan.outputs.create_lineage == 'true' }}
      helper_tag: ${{ needs.plan.outputs.helper_tag }}
      helper_version: ${{ needs.plan.outputs.helper_version }}
      scheduled: ${{ needs.plan.outputs.scheduled == 'true' }}
      trigger: ${{ needs.plan.outputs.trigger }}
    secrets: inherit

  desktop:
    name: Desktop
    needs: [plan, runtime, helper-release]
    if: >-
      always() &&
      needs.plan.outputs.desktop == 'true' &&
      needs.helper-release.result == 'success' &&
      (
        needs.plan.outputs.helper_action == 'reuse' ||
        needs.runtime.result == 'success'
      )
    uses: ./.github/workflows/release-desktop.yml
    with:
      release: ${{ needs.plan.outputs.release }}
      sync_versions: ${{ needs.plan.outputs.sync_versions == 'true' }}
      version: ${{ needs.plan.outputs.desktop_version }}
      create_lineage: ${{ needs.plan.outputs.create_lineage == 'true' }}
      helper_tag: ${{ needs.plan.outputs.helper_tag }}
      helper_version: ${{ needs.plan.outputs.helper_version }}
      scheduled: ${{ needs.plan.outputs.scheduled == 'true' }}
      trigger: ${{ needs.plan.outputs.trigger }}
    secrets: inherit

  vs:
    name: Visual Studio
    needs: [plan, runtime, helper-release]
    if: >-
      always() &&
      needs.plan.outputs.vs == 'true' &&
      needs.helper-release.result == 'success' &&
      (
        needs.plan.outputs.helper_action == 'reuse' ||
        needs.runtime.result == 'success'
      )
    uses: ./.github/workflows/release-vs.yml
    with:
      release: ${{ needs.plan.outputs.release }}
      version: ${{ needs.plan.outputs.vs_version }}
      create_lineage: ${{ needs.plan.outputs.create_lineage == 'true' }}
      helper_tag: ${{ needs.plan.outputs.helper_tag }}
      helper_version: ${{ needs.plan.outputs.helper_version }}
      scheduled: ${{ needs.plan.outputs.scheduled == 'true' }}
      trigger: ${{ needs.plan.outputs.trigger }}
    secrets: inherit
